# Dependabot configuration for testivai-oss
#
# Keeps npm dependencies and GitHub Actions up to date weekly.
# Groups patch + minor updates together to reduce PR churn; major
# updates land as individual PRs because they may need attention.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root workspace (covers all packages via pnpm workspace)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Bundle non-major updates so we get one PR per ecosystem instead of N
      npm-non-major:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # inquirer >=9 is ESM-only (ships raw TypeScript source, drops rxjs CJS).
      # Requires Jest ESM migration before upgrading. Revisit when codebase
      # moves to native ESM.
      - dependency-name: "inquirer"
        versions: [">=9.0.0"]
      # commander >=15 is ESM-only (no require entry in exports). v14 has dual
      # CJS+ESM and is the current target. Unblock when Jest ESM migration done.
      - dependency-name: "commander"
        versions: [">=15.0.0"]
      # TypeScript 7 exposes no JavaScript compiler API, which ts-jest needs
      # ("does not expose the JavaScript compiler API required by ts-jest",
      # #145). Moving to it is a planned migration, not a bump.
      - dependency-name: "typescript"
        versions: [">=7"]
      # The packages support Node 18+ and type against an older Node; a newer
      # major's types let code call APIs that Node lacks (#155).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # examples/expo-web pins React to what its Expo SDK expects (npm ci
      # failed on #252's bump). Upgrade with `npx expo install --fix` there.
      - dependency-name: "react"
      - dependency-name: "react-dom"

  # No separate entry for /action: it is a member of the pnpm workspace above,
  # which updates action/package.json and the one lockfile together. An entry
  # of its own changed package.json only, so its PRs could never install
  # (#42, #131, #139). After a bump that reaches the bundle, rebuild
  # action/dist (`pnpm run build` in action/) and release the action.

  # GitHub Actions used in our workflows (CI, release, codeql)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      # Ungrouped, each runner action opened its own PR and five of them sat
      # open for weeks. Workflow action bumps are near-always routine, so take
      # them as one reviewable PR -- majors included.
      github-actions:
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      # changesets/action 2 runs only with Changesets CLI 3, and release.yml
      # runs on main only, so a PR's CI cannot catch the mismatch. Both move
      # together (#156); drop this then.
      - dependency-name: "changesets/action"
        versions: [">=2"]
