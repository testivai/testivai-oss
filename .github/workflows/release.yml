name: Release

# PR-driven publishing via Changesets.
#
# Workflow shape:
#   1. Contributors add a changeset (`pnpm changeset`) in their PR; the
#      changeset markdown declares which packages bump and at what level.
#   2. When that PR merges to main, this workflow runs in "version" mode
#      and opens (or updates) a tracking PR titled "chore(release): version
#      packages" — that PR contains the version bumps + per-package
#      CHANGELOG.md entries derived from all unreleased changesets.
#   3. Maintainer reviews + merges the tracking PR. When that merges to
#      main, this workflow re-runs and now finds no pending changesets,
#      so it switches to "publish" mode: builds + tests + publishes the
#      bumped packages to npm with provenance attestations.
#
# Replaces the previous workflow_dispatch approach where the maintainer
# had to manually pick package + tag and re-trigger 3-4 times to ship a
# coordinated release.
#
# Manual dispatch is preserved as an escape hatch (e.g. emergency hotfix
# without going through the version-PR flow).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize on main so two merges don't race the version-PR.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release (Changesets)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so changesets/action can write CHANGELOGs that
          # link to the right PR/commit refs.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Run OSS smoke E2E
        run: pnpm e2e

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          # `pnpm release` runs `changeset publish`, which:
          #   - finds the package versions on disk that are AHEAD of npm
          #   - publishes them with `--provenance` (set in package.json
          #     publishConfig + the NPM_CONFIG_PROVENANCE env below)
          # If pending changesets exist, the action instead opens/updates
          # the version-PR and skips publishing.
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets/action reads NPM_TOKEN; setup-node reads NODE_AUTH_TOKEN.
          # Both must be set so the action doesn't fall back to OIDC trusted
          # publishing (which requires npm to have it configured per-package).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "::notice::Published packages:"
            echo '${{ steps.changesets.outputs.publishedPackages }}'
          elif [ -n "${{ steps.changesets.outputs.pullRequestNumber }}" ]; then
            echo "::notice::Version PR open: #${{ steps.changesets.outputs.pullRequestNumber }}"
          else
            echo "::notice::No pending changesets, nothing to release."
          fi

  # A release is only real if a stranger can install it.
  #
  # Every other CI job installs from the pnpm workspace, which by construction
  # cannot see the failure modes that live in the *published* artifacts. All
  # three of these have bitten this repo:
  #
  #   - changesets reported "packages published successfully" for a version npm
  #     never received (witness 2.0.1, 2026-08-20). Every adapter hard-pins the
  #     exact witness version, so one missing publish broke every install path.
  #   - a transitive native dep (sharp -> libvips) carried high-severity
  #     advisories that only `npm audit` on a real install surfaces, and that
  #     npm attributes to *our* package name.
  #   - the standalone capture path failed for every user running as root,
  #     because Chrome needs --no-sandbox there. uid 0 never happens in the
  #     workspace suite.
  #
  # So this job trusts the registry, not the release log.
  verify-published:
    name: Verify published packages install
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Every published version is really on the registry
        env:
          PUBLISHED: ${{ needs.release.outputs.publishedPackages }}
        run: |
          node -e '
            const pkgs = JSON.parse(process.env.PUBLISHED);
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              const missing = [];
              for (const { name, version } of pkgs) {
                let found = false;
                // Allow for propagation, but do not wait forever.
                for (let attempt = 0; attempt < 10 && !found; attempt++) {
                  if (attempt) await sleep(15000);
                  const url = `https://registry.npmjs.org/${name.replace("/", "%2F")}`;
                  const res = await fetch(url, { headers: { "Cache-Control": "no-cache" } });
                  const doc = await res.json();
                  found = Boolean(doc.versions && doc.versions[version]);
                }
                console.log(`${found ? "ok      " : "MISSING "} ${name}@${version}`);
                if (!found) missing.push(`${name}@${version}`);
              }
              if (missing.length) {
                console.log(`::error::Reported as published but absent from npm: ${missing.join(", ")}. Re-run this workflow; changeset publish only sends what npm is missing.`);
                process.exit(1);
              }
            })();
          '

      - name: Install the published packages in a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          # Not --prefer-offline, not the workspace: this is the stranger's install.
          npm install -D @testivai/witness-playwright @playwright/test
          node -p '"witness resolved to " + require(process.env.RUNNER_TEMP + "/smoke/node_modules/@testivai/witness/package.json").version'

      # Deliberately scoped to the Playwright path. `webdriverio` is a peer
      # dependency whose own tree currently carries high advisories upstream
      # (a bare `npm install webdriverio@latest` reports them with no testivai
      # present), so auditing it here would gate releases on someone else's
      # CVEs. Do not "fix" this by adding the webdriverio adapter.
      - name: No high-severity advisories in a fresh install
        working-directory: ${{ runner.temp }}/smoke
        run: npm audit --audit-level=high

      - name: Published packages carry provenance attestations
        working-directory: ${{ runner.temp }}/smoke
        run: npm audit signatures

      - name: Standalone capture works
        working-directory: ${{ runner.temp }}/smoke
        run: |
          printf '<!doctype html><title>t</title><h1>hello</h1>\n' > index.html
          python3 -m http.server 3000 > /dev/null 2>&1 &
          sleep 2
          TESTIVAI_CHROME_PATH="$(command -v google-chrome || command -v chromium-browser)" \
            npx testivai witness http://localhost:3000 --pages "/"
          test -f visual-report/results.json

      - name: Standalone capture works as root
        working-directory: ${{ runner.temp }}/smoke
        run: |
          rm -rf visual-report .testivai
          python3 -m http.server 3001 > /dev/null 2>&1 &
          sleep 2
          # uid 0 is the default in Docker-based CI and agent sandboxes; Chrome
          # refuses to start there without --no-sandbox.
          sudo -E env "PATH=$PATH" \
            TESTIVAI_CHROME_PATH="$(command -v google-chrome || command -v chromium-browser)" \
            npx testivai witness http://localhost:3001 --pages "/"
          test -f visual-report/results.json

      - name: Playwright adapter captures through the reporter
        working-directory: ${{ runner.temp }}/smoke
        run: |
          rm -rf visual-report .testivai
          npx playwright install --with-deps chromium
          cat > playwright.config.ts <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            reporter: [['list'], ['@testivai/witness-playwright/reporter']],
          });
          EOF
          mkdir -p tests
          cat > tests/smoke.spec.ts <<'EOF'
          import { test } from '@playwright/test';
          import { testivai } from '@testivai/witness-playwright';
          test('captures', async ({ page }, testInfo) => {
            await page.goto('http://localhost:3002');
            await testivai.witness(page, testInfo, 'home');
          });
          EOF
          python3 -m http.server 3002 > /dev/null 2>&1 &
          sleep 2
          npx playwright test
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/smoke/visual-report/results.json");
            if (r.summary.total !== 1) {
              console.log("::error::expected 1 snapshot, got " + r.summary.total);
              process.exit(1);
            }
            console.log("captured " + r.summary.total + " snapshot, schema " + r.version);
          '
