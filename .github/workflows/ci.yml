name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build, Test, Pack (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v7

      # Setup pnpm BEFORE setup-node so setup-node's pnpm cache can find it.
      # No `version:` — pnpm/action-setup@v6 reads it from the
      # `packageManager` field in package.json (currently "pnpm@10.0.0").
      # Specifying both errors out: ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint before building: it is the fastest check, so a style-level
      # mistake fails in seconds rather than after a full compile.
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: pnpm lint

      - name: Build all packages
        run: pnpm build

      - name: Build GitHub Action
        run: pnpm --filter testivai-action run build

      # The Action is consumed at runtime via `uses: <repo>@<ref>` and runs
      # the bundled action/dist/index.js. The committed dist/ MUST stay in
      # sync with src/. This guard fails if a PR changed src/ but forgot
      # to rebuild + commit the dist/. Restricted to a single matrix cell
      # so we don't fight ourselves on cross-OS line endings.
      - name: Verify action/dist is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          if ! git diff --exit-code -- action/dist/; then
            echo "::error::action/dist/ is out of sync with src/. Run \`cd action && npm run build\` and commit the result."
            git --no-pager diff --stat -- action/dist/
            exit 1
          fi

      # The element-map collector is injected by every adapter, and its output
      # is compared across runs — and across LANGUAGES, since all adapters
      # share one .testivai/baselines/ directory. Python and Java cannot
      # import the TypeScript source, so they ship a generated copy. If those
      # copies drift, two languages emit different maps for the same page and
      # the diff looks like a real regression. This guard makes that
      # impossible to merge unnoticed.
      - name: Verify generated element-map assets are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          node scripts/generate-element-map-asset.js --check || {
            echo "::error::Generated element-map assets are stale. Run \`pnpm build && node scripts/generate-element-map-asset.js\` and commit the result."
            exit 1
          }

      - name: Run unit tests
        run: pnpm test

      - name: Validate publish surfaces (npm pack --dry-run)
        run: pnpm pack:dry

      - name: Run OSS smoke E2E
        run: pnpm e2e

  python-adapter:
    name: Python adapter (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install and test
        working-directory: python
        run: |
          pip install -e . pytest
          pytest tests/ -q

  ruby-adapter:
    name: Ruby adapter (RSpec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: ruby
      # The specs execute the generated element-map collector through Node
      # against a duck-typed DOM, so Node must be present.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install and test
        working-directory: ruby
        run: |
          gem install rspec -v '~> 3.13' --no-document
          rspec

  java-adapter:
    name: Java adapter (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: java
        run: mvn -B --no-transfer-progress test

  # `pnpm install` from the workspace resolves every @testivai/* dependency to
  # local source, so it cannot see what a consumer actually gets. This job packs
  # the real tarballs and installs them into a clean project OUTSIDE the
  # workspace -- the same thing `npm install @testivai/witness-playwright`
  # produces, minus the registry round-trip.
  #
  # It exists because the workspace suite was green while all of the following
  # were true of the shipped artifacts: a transitive native dep carried
  # high-severity advisories attributed to our package, and standalone capture
  # was broken for every user running as root. Both are cheap to catch here,
  # on the PR, instead of after publishing.
  consumer-install:
    name: Consumer install (packed tarballs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Pack the publishable packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          # `pnpm pack`, not `npm pack`: only pnpm applies the publish-time
          # rewrite of `workspace:*` to a real version range. An npm-packed
          # adapter still says `"@testivai/witness": "workspace:*"` and dies
          # on install with EUNSUPPORTEDPROTOCOL.
          # One directory per package. A flat directory cannot be globbed
          # safely: `testivai-witness-*.tgz` also matches
          # `testivai-witness-webdriverio-*.tgz`, which silently defeats the
          # scoping of the audit step below.
          for pkg in witness playwright selenium webdriverio mcp; do
            mkdir -p "$RUNNER_TEMP/tarballs/$pkg"
            ( cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs/$pkg" )
          done
          ls -1 "$RUNNER_TEMP"/tarballs/*/*.tgz

      - name: Install the tarballs in a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          # One install, all tarballs: the adapters pin the EXACT witness
          # version, which on a version-bump PR is not on the registry yet.
          # Passing them together lets npm satisfy that pin from the local
          # tarball instead of reaching for a version that does not exist.
          npm install "$RUNNER_TEMP"/tarballs/*/*.tgz
          node -p '"installed witness " + require(process.env.RUNNER_TEMP + "/consumer/node_modules/@testivai/witness/package.json").version'

      # Audited in its own project, deliberately WITHOUT the webdriverio
      # adapter. `webdriverio` is a peer dependency, and a bare
      # `npm install webdriverio@latest` -- no testivai in the tree at all --
      # currently reports 7 high advisories of its own (extract-zip via
      # @puppeteer/browsers, deepmerge-ts). Auditing that tree would gate our
      # releases on someone else's CVEs and train everyone to ignore this step.
      # What we can be held to is the dependency tree we choose: witness and
      # the Playwright adapter, where advisories get attributed to our package
      # name and break consumers running `npm audit` in their own CI.
      - name: No high-severity advisories in the tree we control
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          cd "$RUNNER_TEMP/audit"
          npm init -y > /dev/null
          npm install \
            "$RUNNER_TEMP"/tarballs/witness/*.tgz \
            "$RUNNER_TEMP"/tarballs/playwright/*.tgz \
            "$RUNNER_TEMP"/tarballs/mcp/*.tgz \
            "$RUNNER_TEMP"/tarballs/selenium/*.tgz
          # Guard the scoping itself: if the webdriverio adapter ever lands in
          # this tree again, the audit below starts failing on upstream CVEs
          # and the signal is lost.
          if [ -d node_modules/@testivai/witness-webdriverio ]; then
            echo "::error::webdriverio adapter leaked into the audit project; fix the tarball selection"
            exit 1
          fi
          npm audit --audit-level=high

      - name: Standalone capture works
        working-directory: ${{ runner.temp }}/consumer
        run: |
          printf '<!doctype html><title>t</title><h1>hello</h1>\n' > index.html
          python3 -m http.server 3000 > /dev/null 2>&1 &
          sleep 2
          TESTIVAI_CHROME_PATH="$(command -v google-chrome || command -v chromium-browser)" \
            npx testivai witness http://localhost:3000 --pages "/"
          test -f visual-report/results.json

      - name: Standalone capture works as root
        working-directory: ${{ runner.temp }}/consumer
        run: |
          rm -rf visual-report .testivai
          python3 -m http.server 3001 > /dev/null 2>&1 &
          sleep 2
          # uid 0 is the default in Docker-based CI and agent sandboxes, where
          # Chrome will not start without --no-sandbox.
          sudo -E env "PATH=$PATH" \
            TESTIVAI_CHROME_PATH="$(command -v google-chrome || command -v chromium-browser)" \
            npx testivai witness http://localhost:3001 --pages "/"
          test -f visual-report/results.json
