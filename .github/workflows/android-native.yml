# The WebdriverIO adapter on a real Android emulator (Appium 3 +
# UiAutomator2), two checks in one emulator session:
# - native mode (experimental), on Android's own Settings app: no page script
#   runs, the status bar is masked, the device is recorded and keys the
#   snapshot, a clock change passes, dark mode fails the gate
#   (e2e/src/android-native.ts);
# - a hybrid app's WebView, on a fixture app built here from
#   e2e/fixtures/android-webview: every layer in the WebView context
#   (e2e/src/android-webview.ts).
# The summaries, the step screenshots, the visual reports and the Appium log
# are uploaded as the `android-native` artifact.
#
# GitHub's Linux runners support KVM; the emulator does not run without it.

name: Android native

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/webdriverio/**'
      - 'packages/witness/src/**'
      - 'e2e/src/android-*.ts'
      - 'e2e/scripts/android-native.sh'
      - 'e2e/scripts/build-webview-apk.sh'
      - 'e2e/fixtures/android-webview/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: WebdriverIO native mode on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install and build the workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Appium and its driver are global tools, installed outside the
      # workspace (the driver installer itself uses npm).
      - name: Install Appium 3 and the UiAutomator2 driver
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3
          appium --version
          appium driver list --installed

      - name: Build the WebView fixture app
        run: bash e2e/scripts/build-webview-apk.sh "$RUNNER_TEMP/webview-fixture.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the checks on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TESTIVAI_ANDROID_OUT: ${{ runner.temp }}/android-native
          TESTIVAI_WEBVIEW_APK: ${{ runner.temp }}/webview-fixture.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash e2e/scripts/android-native.sh

      - name: Upload the summary, report and Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native
          path: ${{ runner.temp }}/android-native
          if-no-files-found: ignore
