name: MCP Registry

# Publishes packages/mcp/server.json to the official MCP Registry
# (registry.modelcontextprotocol.io), the listing MCP clients and directories
# read @testivai/mcp from. Registry versions are immutable, so each npm release
# needs its own listing: release.yml calls this after it publishes
# @testivai/mcp. Done by hand before, the listing stayed at 0.5.7, under the
# repository's old owner, while npm moved on to 0.7.0.
#
# Run it from the Actions tab to list the version on main that is not listed
# yet (it publishes nothing when the registry already has that version).
#
# The server name ai.testiv/mcp needs proof of owning testiv.ai: mcp-publisher
# signs in with the Ed25519 private key whose public key is in the testiv.ai
# DNS TXT record. That key can publish any server under ai.testiv/*, so it is
# a secret on the mcp-registry-publish environment, which only the main branch
# can deploy to. Setup: CONTRIBUTING.md, "MCP Registry listing".

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # https://github.com/modelcontextprotocol/registry/releases/tag/v1.8.1
  # (sha256 of mcp-publisher_linux_amd64.tar.gz from registry_1.8.1_checksums.txt)
  MCP_PUBLISHER_VERSION: '1.8.1'
  MCP_PUBLISHER_SHA256: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'

jobs:
  publish:
    name: Publish server.json to the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry-publish
    concurrency:
      group: mcp-registry-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Fails when server.json and package.json disagree or npm names another
      # server; waits for npm when the release was just published.
      - name: Is this version listed yet?
        id: check
        run: node scripts/mcp-registry.js check

      - name: Install mcp-publisher
        id: install
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Validate server.json
        id: validate
        if: steps.check.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" validate packages/mcp/server.json'

      - name: Log in to the registry
        id: login
        if: steps.check.outputs.publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
          DOMAIN: ${{ steps.check.outputs.domain }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::error::No MCP_PRIVATE_KEY secret on the mcp-registry-publish environment: add the hex Ed25519 private key whose public key is in the $DOMAIN TXT record (CONTRIBUTING.md, \"MCP Registry listing\")."
            exit 1
          fi
          "$RUNNER_TEMP/mcp-publisher" login dns --domain "$DOMAIN" --private-key "$MCP_PRIVATE_KEY"

      - name: Publish server.json
        id: publish
        if: steps.check.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" publish packages/mcp/server.json'

      - name: Verify the listing
        id: verify
        if: steps.check.outputs.publish == 'true'
        run: node scripts/mcp-registry.js verify
