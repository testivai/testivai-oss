name: 'TestivAI Baseline Approver'
description: >
  Listens for /testivai approve commands on pull request comments and
  updates committed baselines from the latest visual-report artifact.
  Only collaborators with write access can trigger an approval.
author: 'TestivAI'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  github-token:
    description: >
      GitHub token. Needs contents:write (to commit baselines),
      pull-requests:write (to post reply comments) and actions:read (to find
      the visual run and download its report artifact); a workflow with an
      explicit permissions block must list all three. secrets.GITHUB_TOKEN
      works, but GitHub starts no workflow run for a push made with it, so CI
      does not re-run on the approve commit. Pass a fine-grained personal
      access token or GitHub App token with the same permissions to have it
      re-run.
    required: true
    default: ${{ github.token }}

  baselines-dir:
    description: 'Repository-relative path to the committed baselines directory.'
    required: false
    default: '.testivai/baselines'

  artifact-name:
    description: >
      Name of the workflow artifact that contains the visual report and
      pending baselines. Must match the artifact-name used in the
      testivai/testivai-oss@v1 reporter step.
    required: false
    default: 'testivai-visual-report'

  workflow:
    description: >
      Optional filename of the workflow (in .github/workflows/) that runs the
      visual regression tests. When omitted, the newest completed run on the
      PR branch that produced the report artifact is auto-detected — which is
      the right behavior for almost everyone.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:

    # ── Step 1: Parse command, verify commenter, resolve PR branch ──────────
    - name: Parse command + verify permissions
      id: auth
      uses: actions/github-script@v9
      # Runs before the checkout: the logic comes with the action itself
      # (action/dist/approve.cjs), never from the pull request's branch.
      # `approve` must be a word of its own: `/testivai approve-all` gets a
      # reply naming the typo and approves nothing.
      env:
        TESTIVAI_APPROVE_LIB: ${{ github.action_path }}/../action/dist/approve.cjs
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: json
        script: |
          const approve = require(process.env.TESTIVAI_APPROVE_LIB);
          return await approve.auth({ github, context, core });

    # ── Step 2: Checkout the PR branch ─────────────────────────────────────
    - name: Checkout PR branch
      if: ${{ fromJson(steps.auth.outputs.result).skip != true }}
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.github-token }}
        ref:   ${{ fromJson(steps.auth.outputs.result).branch }}

    # ── Step 3: Download the visual-report artifact ─────────────────────────
    - name: Download visual-report artifact
      id: download
      if: ${{ fromJson(steps.auth.outputs.result).skip != true }}
      shell: bash
      env:
        GH_TOKEN:       ${{ inputs.github-token }}
        ARTIFACT_NAME:  ${{ inputs.artifact-name }}
        WORKFLOW_FILE:  ${{ inputs.workflow }}
        PR_BRANCH:      ${{ fromJson(steps.auth.outputs.result).branch }}
        ARTIFACT_DIR:   ${{ runner.temp }}/testivai-artifact
      run: |
        set -euo pipefail

        if [ -n "$WORKFLOW_FILE" ]; then
          echo "Looking for latest '$WORKFLOW_FILE' run on branch: $PR_BRANCH"
          RUN_ID=$(gh run list \
            --repo     "$GITHUB_REPOSITORY" \
            --branch   "$PR_BRANCH" \
            --workflow "$WORKFLOW_FILE" \
            --limit    10 \
            --json     databaseId,conclusion \
            --jq       '[.[] | select(.conclusion != null and .conclusion != "cancelled")] | .[0].databaseId // empty')
        else
          # No workflow filename given: auto-detect the newest completed run
          # on the branch that actually produced the visual-report artifact —
          # works regardless of what the consumer named their workflow file.
          echo "Auto-detecting the latest run with artifact '$ARTIFACT_NAME' on branch: $PR_BRANCH"
          RUN_ID=""
          for id in $(gh run list \
              --repo   "$GITHUB_REPOSITORY" \
              --branch "$PR_BRANCH" \
              --limit  15 \
              --json   databaseId,conclusion \
              --jq     '[.[] | select(.conclusion != null and .conclusion != "cancelled")] | .[].databaseId'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                 --jq '.artifacts[].name' | grep -qx "$ARTIFACT_NAME"; then
              RUN_ID="$id"
              break
            fi
          done
        fi

        if [ -z "$RUN_ID" ]; then
          echo "::error::No completed run with artifact '$ARTIFACT_NAME' found for branch '$PR_BRANCH'. Run the visual regression tests first (the reporter step must have upload-artifact enabled)."
          exit 1
        fi

        # A re-run uploads the report again under the same name, and artifact
        # IDs are not in upload order, so `gh run download --name` could fetch
        # an earlier attempt's report and approve its captures. Take the newest
        # unexpired one by creation time and download it by ID.
        ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
          --jq '[.artifacts[] | select(.name == $ENV.ARTIFACT_NAME and (.expired | not))] | sort_by(.created_at) | last | .id // empty')
        if [ -z "$ARTIFACT_ID" ]; then
          echo "::error::Run $RUN_ID has no unexpired artifact '$ARTIFACT_NAME'. Re-run the visual regression tests."
          exit 1
        fi

        echo "Downloading artifact '$ARTIFACT_NAME' (ID $ARTIFACT_ID) from run $RUN_ID..."
        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        mkdir -p "$ARTIFACT_DIR"
        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ARTIFACT_DIR.zip"
        unzip -q -o "$ARTIFACT_DIR.zip" -d "$ARTIFACT_DIR"
        rm -f "$ARTIFACT_DIR.zip"

        echo "Artifact downloaded. Contents:"
        find "$ARTIFACT_DIR" -type f | sort | head -40

    # ── Step 4: Copy pending baselines into .testivai/baselines/ ───────────
    - name: Apply baseline approvals
      if: ${{ fromJson(steps.auth.outputs.result).skip != true }}
      id: apply
      shell: bash
      env:
        TARGET:        ${{ fromJson(steps.auth.outputs.result).target }}
        BASELINES_DIR: ${{ inputs.baselines-dir }}
        ARTIFACT_DIR:  ${{ runner.temp }}/testivai-artifact
      run: |
        set -euo pipefail

        PENDING_DIR="$ARTIFACT_DIR/pending-baselines"

        if [ ! -d "$PENDING_DIR" ]; then
          echo "::error::No pending-baselines found in the artifact."
          echo "Make sure you are using testivai/testivai-oss@v1 (v1.0.2+) with upload-artifact: true."
          exit 1
        fi

        echo "Available pending baselines:"
        ls "$PENDING_DIR"

        # Resolve snapshot names to approve
        if [ "$TARGET" = "--all" ]; then
          NAMES=$(find "$PENDING_DIR" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
        else
          NAMES="$TARGET"
        fi

        APPROVED_LIST=""
        SKIPPED_LIST=""

        set -f   # a name like '*' must not glob against the checkout
        for name in $NAMES; do
          SRC="$PENDING_DIR/$name"
          DST="$BASELINES_DIR/$name"

          # Names come from the PR comment and from the artifact's directory
          # names, which the PR's own CI run wrote. Approve only a real
          # directory directly inside pending-baselines, so no name reaches
          # outside it or outside the baselines dir.
          case "$name" in
            .|..|*/*) known=false ;;
            *) if [ -d "$SRC" ] && [ ! -L "$SRC" ]; then known=true; else known=false; fi ;;
          esac

          if [ "$known" != true ]; then
            echo "::warning::Snapshot '$name' not found in pending baselines — skipping."
            SKIPPED_LIST="$SKIPPED_LIST $name"
            continue
          fi

          mkdir -p "$DST"
          cp -r "$SRC/." "$DST/"
          echo "  ✓ approved: $name"
          APPROVED_LIST="$APPROVED_LIST $name"
        done
        set +f

        # Trim leading spaces
        APPROVED_LIST="${APPROVED_LIST# }"
        SKIPPED_LIST="${SKIPPED_LIST# }"
        COUNT=$(echo "$APPROVED_LIST" | tr ' ' '\n' | grep -c . || true)

        echo "approved=$APPROVED_LIST"  >> "$GITHUB_OUTPUT"
        echo "skipped=$SKIPPED_LIST"   >> "$GITHUB_OUTPUT"
        echo "count=$COUNT"            >> "$GITHUB_OUTPUT"

    # ── Step 5: Commit and push the updated baselines ──────────────────────
    - name: Commit updated baselines
      if: ${{ fromJson(steps.auth.outputs.result).skip != true && steps.apply.outputs.count != '0' }}
      shell: bash
      env:
        APPROVED:      ${{ steps.apply.outputs.approved }}
        ACTOR:         ${{ fromJson(steps.auth.outputs.result).actor }}
        BASELINES_DIR: ${{ inputs.baselines-dir }}
      run: |
        set -euo pipefail

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add "$BASELINES_DIR/"

        if git diff --cached --quiet; then
          echo "Nothing new to commit — baselines already up to date."
          exit 0
        fi

        # Build a compact snapshot list for the commit message
        SNAPSHOT_LINE=$(echo "$APPROVED" | tr ' ' ', ')
        COMMIT_MSG="chore(baselines): approve visual snapshots"$'\n\n'"Approved by @${ACTOR} via PR comment."$'\n'"Snapshots: ${SNAPSHOT_LINE}"
        git commit -m "$COMMIT_MSG"

        git push

    # ── Step 6: Post confirmation comment ───────────────────────────────────
    # Names the approved run and, when publish@v1 has put that run's report on
    # GitHub Pages, links it and each approved snapshot's card in it (the link
    # comes from the TestivAI comment, never guessed). Logic: action/dist/approve.cjs.
    - name: Post confirmation comment
      if: ${{ fromJson(steps.auth.outputs.result).skip != true }}
      uses: actions/github-script@v9
      # Values arrive through env, never spliced into the script: snapshot
      # names come from the PR comment and from the PR's own CI artifact.
      env:
        TESTIVAI_APPROVE_LIB: ${{ github.action_path }}/../action/dist/approve.cjs
        APPROVED:     ${{ steps.apply.outputs.approved }}
        SKIPPED:      ${{ steps.apply.outputs.skipped }}
        COUNT:        ${{ steps.apply.outputs.count }}
        ACTOR:        ${{ fromJson(steps.auth.outputs.result).actor }}
        RUN_ID:       ${{ steps.download.outputs.run-id }}
        ARTIFACT_DIR: ${{ runner.temp }}/testivai-artifact
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const approve = require(process.env.TESTIVAI_APPROVE_LIB);
          await approve.reply({ github, context, core, env: process.env });
