<!doctype html>
<!--
  Fixture for standalone-determinism.test.ts. Each ingredient is one the
  stale-frame capture bug needed to show up reliably: blurred composited
  layers (fixed nav with backdrop-filter, filter: blur orb), a masked grid,
  an entry animation, and styles that depend on the viewport (100vh hero,
  vw heading, a max-width media query). No external resources.
-->
<html>
<head>
<meta charset="utf-8">
<title>viewport fixture</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #08111f; color: #e8f0ff; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 70px; padding: 0 52px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8, 17, 31, 0.88); backdrop-filter: blur(24px);
    transition: all 0.3s;
  }
  .hero {
    position: relative; overflow: hidden; box-sizing: border-box;
    min-height: 100vh; padding: 120px 52px 48px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .orb {
    position: absolute; width: 600px; height: 600px; top: -100px; left: 50%;
    transform: translateX(-50%); border-radius: 50%; filter: blur(80px); pointer-events: none;
    background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, transparent 70%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0, 212, 255, 0.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.2) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 0%, transparent 80%);
  }
  h1 { font-size: clamp(3rem, 7vw, 6.5rem); margin: 0; }
  h1, .hero p { position: relative; z-index: 1; opacity: 0; animation: rise 0.6s ease 0.2s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .content { max-width: 752px; margin: 0 auto; padding: 40px 0; line-height: 1.8; }
  @media (max-width: 900px) { nav { padding: 0 24px; } h1 { font-size: 2.2rem; } }
</style>
</head>
<body>
  <nav><b>Logo</b><span>Docs FAQ</span><b>GitHub</b></nav>
  <section class="hero">
    <div class="orb"></div>
    <div class="grid"></div>
    <h1>Viewport fixture</h1>
    <p>min-height: 100vh hero with a vw-sized heading</p>
  </section>
  <div class="content" id="content"></div>
  <script>
    // Several viewports of text, so the capture reaches well beyond the viewport.
    const content = document.getElementById('content');
    for (let i = 1; i <= 40; i++) {
      const p = document.createElement('p');
      p.textContent = 'Paragraph ' + i + ' of filler text that makes the page several viewports tall.';
      content.appendChild(p);
    }
  </script>
</body>
</html>
