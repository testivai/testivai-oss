name: 'TestivAI Visual Report'
description: 'Post TestivAI visual regression results to PRs and commit status'
author: 'TestivAI'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for posting comments and statuses'
    required: true
    default: ${{ github.token }}
  report-dir:
    description: 'Directory containing results.json and report.html'
    required: true
    default: 'visual-report'
  fail-on-diff:
    description: 'Fail the workflow if visual changes are detected'
    required: false
    default: 'false'
  fail-on-missing:
    description: >-
      Fail the workflow when a committed baseline received no capture this run
      (silent coverage loss). Unlike fail-on-diff this is not about intentional
      changes, so it is the safer thing to enforce.
    required: false
    default: 'false'
  upload-artifact:
    description: 'Upload the visual report as a workflow artifact'
    required: false
    default: 'true'
  artifact-retention-days:
    description: 'Number of days to retain the artifact'
    required: false
    default: '30'
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'testivai-visual-report'
  status-context:
    description: 'Name of the commit status context; also namespaces the PR comment (use a distinct value per workflow when multiple visual lanes run in one repo)'
    required: false
    default: 'TestivAI / visual'

outputs:
  artifact-id:
    description: 'ID of the uploaded artifact (empty if upload-artifact is false)'

runs:
  using: 'node24'
  # action.yml lives at the repo root because GitHub Marketplace only
  # auto-lists actions whose metadata file is at root:
  # https://docs.github.com/en/actions/sharing-automations/creating-actions/publishing-actions-in-github-marketplace
  # The bundled JS still lives under action/dist/ so build artifacts
  # don't pollute the workspace root. `main` is resolved relative to
  # this file.
  main: 'action/dist/index.js'
