name: 'TestivAI Publish Reports'
description: >
  Publishes TestivAI visual reports to this repository's GitHub Pages site, so
  a pull request comment links straight to the report instead of a ZIP: the
  last runs of each open pull request (forks included) and the latest run on
  the default branch, each page rebuilt from its run's results and
  screenshots. The site is rebuilt from scratch every time, so a closed pull
  request's reports go with the next publish. With site-dir, a website of
  your own goes at the root, as it is, and the reports under reports-path.
  Who can open the site is
  GitHub's setting: it publishes only where an admin set Settings → Pages →
  Source to "GitHub Actions", and a private repository's reports go on a
  public site only with TESTIVAI_PUBLIC_REPORTS=true. It never checks out or
  runs the pull request's code.
author: 'TestivAI'

branding:
  icon: 'globe'
  color: 'purple'

inputs:
  github-token:
    description: >
      Token for reading the repository, its Pages settings, runs and
      artifacts, and for the report links in pull request comments. Needs
      actions:read, pages:read and pull-requests:write. The default posts as
      github-actions[bot], the author the action looks for when it updates
      its own comment on a fork's pull request. The deploy always uses the
      job's own token.
    required: false
    default: ${{ github.token }}

  artifact-name:
    description: >
      Name of the report artifact the TestivAI reporter action uploads (its
      artifact-name input).
    required: false
    default: 'testivai-visual-report'

  runs-per-pr:
    description: >
      How many of each open pull request's latest runs to publish, 1 to 10.
      Every publish downloads them all again (with cache: true, only the
      ones it has not built before), so lower it for a repository with many
      open pull requests.
    required: false
    default: '3'

  public-reports:
    description: >
      Pass the variable vars.TESTIVAI_PUBLIC_REPORTS. 'true' allows publishing the
      reports of a private or internal repository to a public Pages site;
      without it, such a site gets nothing. Set the variable on the
      github-pages environment, which only admins can configure. A
      repository variable of the same name counts too when the environment
      has none, and people with write access can create those, so this guards
      against publishing by accident; it is not an access control.
    required: false
    default: ''

  status-context:
    description: >
      The reporter action's status-context, if you set one: the comment to
      add the links to is that lane's.
    required: false
    default: ''

  include-dir:
    description: >
      A folder of your own pages to publish with the reports, built by an
      earlier step from the default branch (never from a pull request),
      relative to the workspace. Published as it is under include-name/ and
      linked from the front page; symbolic links in it are skipped, and its
      size counts toward the site's.
    required: false
    default: ''

  include-name:
    description: >
      The folder include-dir goes in on the site, such as demo: lowercase
      letters, digits, '-' and '_', not pr or main. Required with include-dir.
    required: false
    default: ''

  site-dir:
    description: >
      An already-built website to deploy at the root of the Pages site, with
      the reports under reports-path: for a repository whose Pages site is a
      website. Build it in an earlier job from the default branch, never from
      a pull request, relative to the workspace. Published as it is, every
      file byte for byte (hidden files included; symbolic links skipped), and
      its size counts toward the site's. It must not have reports-path. Where
      the settings refuse the reports (a private repository's public site
      without TESTIVAI_PUBLIC_REPORTS, or an address without https), the site
      is deployed without them; where Pages builds from a branch, nothing is
      deployed. Not with include-dir.
    required: false
    default: ''

  reports-path:
    description: >
      The folder the reports go in on a site-dir site, such as visual-reports:
      one to four lowercase folder names (letters, digits, '-', '_') joined by
      '/'. The front page, each pull request's pages, the default branch's
      and every link to them go there. Required with site-dir.
    required: false
    default: ''

  comment:
    description: >
      true (the default) adds the report links to the TestivAI comment on
      each pull request, and posts a comment with the link on a fork's pull
      request, whose CI run cannot comment. false leaves comments alone.
    required: false
    default: 'true'

  cache:
    description: >
      false (the default) downloads every report on every publish. true keeps
      each report ZIP it downloads in the Actions cache, so the next publish
      downloads only the runs it has not built before. A ZIP from the cache is
      used only when its SHA-256 is the digest GitHub lists for the artifact,
      and every page is rebuilt from it as from a download. But actions/cache
      unpacks an entry before that check, in this job, which holds
      pages: write and id-token: write, and a workflow on the default branch
      that GitHub gives a writable cache (one a push, schedule or
      workflow_dispatch starts) can save one: turn it on only where no code
      you do not trust runs in such a workflow. Each publish that changes the
      set of reports saves a new full copy of the folder (up to the site's
      900 MB budget), and old copies go only when GitHub evicts them (unused
      for 7 days, or the least recently used once the repository is over its
      cache limit), so on a busy repository it can push out other caches.
    required: false
    default: 'false'

outputs:
  published:
    description: "'true' when the site was built and deployed, 'false' when the repository's settings say not to."
    value: ${{ steps.build.outputs.published }}
  reports-published:
    description: >
      'true' when the reports are on the deployed site. 'false' when nothing
      was deployed, or a site-dir site was deployed without them.
    value: ${{ steps.build.outputs.reports-published }}
  page-url:
    description: >
      The reports' https address: the site's, under reports-path with
      site-dir; the one the deploy reports (GitHub gives a github.io address
      as http, read here as https), else the one from the repository's Pages
      settings. With site-dir and no reports, the site's own address.
    value: ${{ steps.finish.outputs.page-url || steps.build.outputs.page-url }}

runs:
  using: 'composite'
  steps:
    # The report ZIPs earlier publishes downloaded, by artifact id: the newest
    # cache this repository's publishes saved (each saves under its own run's
    # key). Not trusted: the build uses a ZIP only when its SHA-256 is the
    # artifact's digest. A miss or a cache error never fails the publish.
    - name: Restore the reports earlier publishes downloaded
      id: cache-restore
      if: inputs.cache == 'true'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/testivai-pages/cache
        key: testivai-pages-reports-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: testivai-pages-reports-v1-${{ github.repository_id }}-

    # Reads the Pages settings, then (when they allow it) downloads each
    # report it has not built before and rebuilds every page from
    # results.json and the PNGs only.
    - name: Build the reports site
      id: build
      uses: actions/github-script@v9
      env:
        TESTIVAI_PUBLISH_LIB: ${{ github.action_path }}/../action/dist/publish.cjs
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RUNS_PER_PR: ${{ inputs.runs-per-pr }}
        PUBLIC_REPORTS: ${{ inputs.public-reports }}
        INCLUDE_DIR: ${{ inputs.include-dir }}
        INCLUDE_NAME: ${{ inputs.include-name }}
        SITE_DIR: ${{ inputs.site-dir }}
        REPORTS_PATH: ${{ inputs.reports-path }}
        CACHE: ${{ inputs.cache }}
        CACHE_DIR: ${{ runner.temp }}/testivai-pages/cache
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const publish = require(process.env.TESTIVAI_PUBLISH_LIB);
          await publish.build({ github, context, core, env: process.env });

    # Only when the build added or removed a report; before the deploy, so a
    # publish that a newer one cancels still leaves its downloads. Where
    # GitHub gives the run a read-only cache (pull_request_target, or a
    # workflow_run a fork's pull request started), it saves nothing and warns.
    - name: Save the downloaded reports for the next publish
      id: cache-save
      if: inputs.cache == 'true' && steps.build.outputs.cache-save == 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/testivai-pages/cache
        key: testivai-pages-reports-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

    # A site-dir site is published as it is, hidden files included (.git and
    # .github are always left out); the reports site has none.
    - name: Upload the site
      id: upload
      if: steps.build.outputs.published == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ steps.build.outputs.site-dir }}
        include-hidden-files: ${{ inputs.site-dir != '' }}

    # Needs pages:write and id-token:write, and the job's environment set to
    # github-pages.
    - name: Deploy to GitHub Pages
      id: deploy
      if: steps.build.outputs.published == 'true'
      uses: actions/deploy-pages@v5

    - name: Add the report links to the pull requests
      id: finish
      if: steps.build.outputs.published == 'true'
      uses: actions/github-script@v9
      env:
        TESTIVAI_PUBLISH_LIB: ${{ github.action_path }}/../action/dist/publish.cjs
        STATE_FILE: ${{ steps.build.outputs.state-file }}
        PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        COMMENT: ${{ inputs.comment }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const publish = require(process.env.TESTIVAI_PUBLISH_LIB);
          await publish.finish({ github, context, core, env: process.env });
