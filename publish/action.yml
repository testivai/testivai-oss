name: 'TestivAI Publish Reports'
description: >
  Publishes TestivAI visual reports to this repository's GitHub Pages site, so
  a pull request comment links straight to the report instead of a ZIP: the
  last runs of each open pull request (forks included) and the latest run on
  the default branch, each page rebuilt from its run's results and
  screenshots. The site is rebuilt from scratch every time, so a closed pull
  request's reports go with the next publish. Who can open the site is
  GitHub's setting: it publishes only where Settings → Pages → Source is
  "GitHub Actions", and a private repository's reports go on a public site
  only with TESTIVAI_PUBLIC_REPORTS=true. An admin sets the source, or, given
  enable-pages-token, the action creates the site once, on a publish that
  finds no Pages site at all (public repositories only, unless enable-pages
  is always). It never changes an existing site's settings, a branch-based
  one included. It never checks out or runs the pull request's code.
author: 'TestivAI'

branding:
  icon: 'globe'
  color: 'purple'

inputs:
  github-token:
    description: >
      Token for reading the repository, its Pages settings, runs and
      artifacts, and for the report links in pull request comments. Needs
      actions:read, pages:read and pull-requests:write. The default posts as
      github-actions[bot], the author the action looks for when it updates
      its own comment on a fork's pull request. The deploy always uses the
      job's own token.
    required: false
    default: ${{ github.token }}

  artifact-name:
    description: >
      Name of the report artifact the TestivAI reporter action uploads (its
      artifact-name input).
    required: false
    default: 'testivai-visual-report'

  runs-per-pr:
    description: >
      How many of each open pull request's latest runs to publish, 1 to 10.
      Every publish downloads them all again, so lower it for a repository
      with many open pull requests.
    required: false
    default: '3'

  public-reports:
    description: >
      Pass the variable vars.TESTIVAI_PUBLIC_REPORTS. 'true' allows publishing the
      reports of a private or internal repository to a public Pages site;
      without it, such a site gets nothing. Set the variable on the
      github-pages environment, which only admins can configure. A
      repository variable of the same name counts too when the environment
      has none, and people with write access can create those, so this guards
      against publishing by accident; it is not an access control.
    required: false
    default: ''

  status-context:
    description: >
      The reporter action's status-context, if you set one: the comment to
      add the links to is that lane's.
    required: false
    default: ''

  include-dir:
    description: >
      A folder of your own pages to publish with the reports, built by an
      earlier step from the default branch (never from a pull request),
      relative to the workspace. Published as it is under include-name/ and
      linked from the front page; symbolic links in it are skipped, and its
      size counts toward the site's.
    required: false
    default: ''

  include-name:
    description: >
      The folder include-dir goes in on the site, such as demo: lowercase
      letters, digits, '-' and '_', not pr or main. Required with include-dir.
    required: false
    default: ''

  comment:
    description: >
      true (the default) adds the report links to the TestivAI comment on
      each pull request, and posts a comment with the link on a fork's pull
      request, whose CI run cannot comment. false leaves comments alone.
    required: false
    default: 'true'

  enable-pages:
    description: >
      true (the default): when this repository is public and has no GitHub
      Pages site at all, create one, once, with the source "GitHub Actions",
      and publish to it in the same run. It needs enable-pages-token; without
      one nothing is enabled. always: a private or internal repository too
      (its new site is public unless the organization has private Pages, and
      reports go on a public site only with TESTIVAI_PUBLIC_REPORTS=true).
      false: never. A site that exists, a branch-based one included, is never
      changed: the action creates one only where GitHub reports no Pages site.
    required: false
    default: 'true'

  enable-pages-token:
    description: >
      A token that can create this repository's Pages site, for
      enable-pages, from a secret: a fine-grained personal access token of an
      admin with Administration and Pages write on this repository, a classic
      one with the repo scope, or a GitHub App token with administration
      write and pages write. The job's GITHUB_TOKEN cannot: GitHub gives it no
      Administration permission. Only the enablement step gets it, and only
      on a publish that finds no Pages site. Remove it once Pages is on: while
      it is set, a publish after Pages is turned off turns it back on.
    required: false
    default: ''

outputs:
  published:
    description: "'true' when the site was built and deployed, 'false' when the repository's settings say not to."
    value: ${{ steps.build.outputs.published }}
  page-url:
    description: >
      The site's https address: the one the deploy reports (GitHub gives a
      github.io address as http, read here as https), else the one from the
      repository's Pages settings.
    value: ${{ steps.finish.outputs.page-url || steps.build.outputs.page-url }}

runs:
  using: 'composite'
  steps:
    # enable-pages, only with a token that can create a site: reads the Pages
    # settings; pages-found is 'false' only when GitHub answers 404.
    - name: Look up the GitHub Pages site
      id: lookup
      if: inputs.enable-pages != 'false' && inputs.enable-pages-token != ''
      uses: actions/github-script@v9
      env:
        TESTIVAI_PUBLISH_LIB: ${{ github.action_path }}/../action/dist/publish.cjs
        ENABLE_PAGES: ${{ inputs.enable-pages }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const publish = require(process.env.TESTIVAI_PUBLISH_LIB);
          await publish.lookup({ github, context, core, env: process.env });

    # Creates a site with the source "GitHub Actions" where there is none.
    # configure-pages creates one only when its own lookup finds none too, so
    # an existing site is never changed. A failure (the token cannot, or no
    # Pages on this plan) leaves the build to say Pages is off.
    - name: Enable GitHub Pages
      id: enable
      if: steps.lookup.outputs.pages-found == 'false' && steps.lookup.outputs.enable == 'true'
      continue-on-error: true
      uses: actions/configure-pages@v6
      with:
        enablement: true
        token: ${{ inputs.enable-pages-token }}

    # Reads the Pages settings, then (when they allow it) downloads each
    # report and rebuilds its page from results.json and the PNGs only.
    - name: Build the reports site
      id: build
      uses: actions/github-script@v9
      env:
        TESTIVAI_PUBLISH_LIB: ${{ github.action_path }}/../action/dist/publish.cjs
        ENABLE_OUTCOME: ${{ steps.enable.outcome }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RUNS_PER_PR: ${{ inputs.runs-per-pr }}
        PUBLIC_REPORTS: ${{ inputs.public-reports }}
        INCLUDE_DIR: ${{ inputs.include-dir }}
        INCLUDE_NAME: ${{ inputs.include-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const publish = require(process.env.TESTIVAI_PUBLISH_LIB);
          await publish.build({ github, context, core, env: process.env });

    - name: Upload the site
      if: steps.build.outputs.published == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ steps.build.outputs.site-dir }}

    # Needs pages:write and id-token:write, and the job's environment set to
    # github-pages.
    - name: Deploy to GitHub Pages
      id: deploy
      if: steps.build.outputs.published == 'true'
      uses: actions/deploy-pages@v5

    - name: Add the report links to the pull requests
      id: finish
      if: steps.build.outputs.published == 'true'
      uses: actions/github-script@v9
      env:
        TESTIVAI_PUBLISH_LIB: ${{ github.action_path }}/../action/dist/publish.cjs
        STATE_FILE: ${{ steps.build.outputs.state-file }}
        PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        COMMENT: ${{ inputs.comment }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const publish = require(process.env.TESTIVAI_PUBLISH_LIB);
          await publish.finish({ github, context, core, env: process.env });
